<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawkins' Theorem II</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1c11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        canvas { background-color: rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-light text-[#d4af37] mb-4 tracking-widest">HAWKINS' THEOREM II</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Another geometric proof from Dr. Gerald Hawkins. This theorem features an equilateral triangle with 
            its circumscribed circle. Circles constructed on the sides of the triangle generate areas with exact 
            diatonic ratios (like 4:3, representing musical intervals).
        </p>
    </div>
    
    <div class="relative rounded-full border border-[#d4af37]/20 p-2">
        <canvas id="cropCanvas" width="500" height="500" class="rounded-full"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const THEME = '#d4af37';

        function draw() {
            const R = 120; // Radius of circumscribed circle
            const sideLen = R * Math.sqrt(3); // Side length of inscribed equilateral triangle
            
            ctx.strokeStyle = THEME;
            ctx.lineWidth = 2;

            // 1. Circumscribed Circle
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.stroke();

            // 2. Equilateral Triangle
            const vertices = [];
            ctx.beginPath();
            for (let i = 0; i < 3; i++) {
                const angle = -Math.PI / 2 + (i * Math.PI * 2 / 3);
                const px = cx + R * Math.cos(angle);
                const py = cy + R * Math.sin(angle);
                vertices.push({x: px, y: py});
                
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(212, 175, 55, 0.1)';
            ctx.fill();
            ctx.stroke();

            // 3. Circles constructed on the sides (Radius = Side Length / 2)
            const sideRadius = sideLen / 2;
            
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
            
            for (let i = 0; i < 3; i++) {
                const p1 = vertices[i];
                const p2 = vertices[(i + 1) % 3];
                
                // Midpoint of the side
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;

                ctx.beginPath();
                ctx.arc(midX, midY, sideRadius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Highlight the center of these circles
                ctx.beginPath();
                ctx.arc(midX, midY, 3, 0, Math.PI * 2);
                ctx.fillStyle = THEME;
                ctx.fill();
            }
            
            // Outer enclosure ring
            const outerBounds = R + sideRadius;
            ctx.beginPath();
            ctx.arc(cx, cy, outerBounds, 0, Math.PI * 2);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
            ctx.stroke();
        }
        
        draw();
    </script>
</body>
</html>
