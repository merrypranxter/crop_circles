<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woodborough Hill Sunflower (2000)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1c11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        canvas { background-color: rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-light text-[#d4af37] mb-4 tracking-widest">WOODBOROUGH SUNFLOWER (2000)</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Found on Woodborough Hill in Wiltshire, this design is constructed out of 308 intersecting triangles/diamonds of standing crop. 
            It is generated by overlapping 44 spirals based on the golden mean (ratio 1:1.618), mimicking phyllotaxis found in nature.
        </p>
    </div>
    
    <div class="relative rounded-full border border-[#d4af37]/20 p-2">
        <canvas id="cropCanvas" width="600" height="600" class="rounded-full"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const THEME = '#d4af37';

        function draw() {
            const numSpirals = 44; // 44 spirals in each direction
            const maxRadius = 260;
            
            ctx.strokeStyle = THEME;
            ctx.lineWidth = 1;

            // Draw 44 outward clockwise spirals
            for (let i = 0; i < numSpirals; i++) {
                ctx.beginPath();
                const offset = (i / numSpirals) * Math.PI * 2;
                
                // Using logarithmic spiral r = a * e^(b * theta)
                for (let theta = 0; theta < Math.PI * 2.5; theta += 0.05) {
                    const r = 15 * Math.exp(0.3 * theta);
                    if (r > maxRadius) break;
                    
                    const x = cx + r * Math.cos(theta + offset);
                    const y = cy + r * Math.sin(theta + offset);
                    
                    if (theta === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // Draw 44 outward counter-clockwise spirals
            for (let i = 0; i < numSpirals; i++) {
                ctx.beginPath();
                const offset = (i / numSpirals) * Math.PI * 2;
                
                for (let theta = 0; theta < Math.PI * 2.5; theta += 0.05) {
                    const r = 15 * Math.exp(0.3 * theta);
                    if (r > maxRadius) break;
                    
                    const x = cx + r * Math.cos(-theta + offset);
                    const y = cy + r * Math.sin(-theta + offset);
                    
                    if (theta === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            
            // Draw central hub
            ctx.beginPath();
            ctx.arc(cx, cy, 15, 0, Math.PI * 2);
            ctx.fillStyle = '#0b1c11';
            ctx.fill();
            ctx.stroke();
        }
        
        draw();
    </script>
</body>
</html>
