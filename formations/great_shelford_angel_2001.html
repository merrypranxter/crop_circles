<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Shelford Angel (2001)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1c11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        canvas { background-color: rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-light text-[#d4af37] mb-4 tracking-widest">GREAT SHELFORD ANGEL (2001)</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            Appearing in Cambridgeshire, this formation elegantly uses intersecting circles of varying radii 
            to create crescents and arcs resembling a winged figure or angel. It is a masterpiece of subtractive 
            Euclidean geometry.
        </p>
    </div>
    
    <div class="relative rounded-full border border-[#d4af37]/20 p-2">
        <canvas id="cropCanvas" width="500" height="500" class="rounded-full"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const THEME = '#d4af37';

        function draw() {
            ctx.strokeStyle = THEME;
            ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
            ctx.lineWidth = 2;

            const baseRadius = 140;

            // Outer confining ring
            ctx.beginPath();
            ctx.arc(cx, cy, baseRadius + 30, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
            ctx.stroke();
            
            ctx.strokeStyle = THEME;

            // Central "Body"
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // "Head" / Top Circle
            ctx.beginPath();
            ctx.arc(cx, cy - 80, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Wing 1 (Right)
            ctx.beginPath();
            ctx.arc(cx + 60, cy - 20, 90, -Math.PI / 2.5, Math.PI / 1.5);
            ctx.stroke();
            
            // Wing 1 Inner Edge (Subtractive crescent effect)
            ctx.beginPath();
            ctx.arc(cx + 80, cy - 20, 70, -Math.PI / 2.2, Math.PI / 1.4);
            ctx.stroke();

            // Wing 2 (Left)
            ctx.beginPath();
            ctx.arc(cx - 60, cy - 20, 90, Math.PI / 3, Math.PI + Math.PI / 2.5);
            ctx.stroke();

            // Wing 2 Inner Edge
            ctx.beginPath();
            ctx.arc(cx - 80, cy - 20, 70, Math.PI / 3.5, Math.PI + Math.PI / 2.2);
            ctx.stroke();

            // "Tail" / Bottom Arcs
            ctx.beginPath();
            ctx.arc(cx, cy + 90, 60, Math.PI, 0);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy + 110, 80, Math.PI + 0.3, -0.3);
            ctx.stroke();
            
            // Center Dot
            ctx.beginPath();
            ctx.arc(cx, cy - 80, 3, 0, Math.PI * 2);
            ctx.fillStyle = THEME;
            ctx.fill();
        }
        
        draw();
    </script>
</body>
</html>
