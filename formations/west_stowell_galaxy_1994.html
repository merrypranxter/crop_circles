<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Stowell Galaxy (1994)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1c11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        canvas { background-color: rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-light text-[#d4af37] mb-4 tracking-widest">GALAXY (1994)</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            This formation visually represented a spiraling galaxy or vortex. It features sweeping, tapered 
            arms radiating from a central hub, terminating in planetary spheres. The geometry mimics orbital 
            decay and galactic rotation curves.
        </p>
    </div>
    
    <div class="relative rounded-full border border-[#d4af37]/20 p-2">
        <canvas id="cropCanvas" width="500" height="500" class="rounded-full"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const THEME = '#d4af37';

        function draw() {
            const numArms = 5;
            const maxRadius = 180;
            
            ctx.strokeStyle = THEME;
            ctx.fillStyle = THEME;

            // Central Sun/Hub
            ctx.beginPath();
            ctx.arc(cx, cy, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(cx, cy, 35, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Spiral Arms
            for (let i = 0; i < numArms; i++) {
                const angleOffset = (i * Math.PI * 2) / numArms;
                
                ctx.beginPath();
                ctx.moveTo(cx + 35 * Math.cos(angleOffset), cy + 35 * Math.sin(angleOffset));
                
                // Draw thick sweeping curve
                const endAngle = angleOffset + Math.PI / 1.5;
                const endX = cx + maxRadius * Math.cos(endAngle);
                const endY = cy + maxRadius * Math.sin(endAngle);
                
                const ctrlX = cx + (maxRadius * 0.7) * Math.cos(angleOffset + Math.PI/6);
                const ctrlY = cy + (maxRadius * 0.7) * Math.sin(angleOffset + Math.PI/6);

                ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
                ctx.lineWidth = 12;
                ctx.lineCap = "round";
                ctx.stroke();

                // Draw terminating planet/star
                ctx.beginPath();
                ctx.arc(endX, endY, 15, 0, Math.PI * 2);
                ctx.fill();
                
                // Draw smaller satellite
                const satAngle = endAngle + Math.PI / 4;
                ctx.beginPath();
                ctx.arc(endX + 30 * Math.cos(satAngle), endY + 30 * Math.sin(satAngle), 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Ethereal outer boundary ring
            ctx.beginPath();
            ctx.arc(cx, cy, maxRadius + 45, 0, Math.PI * 2);
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
            ctx.stroke();
        }
        
        draw();
    </script>
</body>
</html>
