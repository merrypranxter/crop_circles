<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidlington Mandelbrot Set (1992)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b1c11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        canvas { background-color: rgba(0,0,0,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl text-center mb-8">
        <h1 class="text-3xl font-light text-[#d4af37] mb-4 tracking-widest">KIDLINGTON MANDELBROT (1992)</h1>
        <p class="text-slate-400 text-sm leading-relaxed">
            The appearance of the Mandelbrot Set in a field in Oxfordshire marked a turning point in crop circle complexity. 
            This visualization uses parametric equations to draw the exact geometric boundaries of the fractal's 
            main cardioid and the adjoining period-2 circular bulb.
        </p>
    </div>
    
    <div class="relative border border-[#d4af37]/20 p-2 rounded-2xl">
        <canvas id="cropCanvas" width="600" height="400" class="rounded-xl"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2 + 50; // Offset to center the Mandelbrot horizontally
        const cy = canvas.height / 2;
        const THEME = '#d4af37';

        function draw() {
            const scale = 110; 
            
            ctx.strokeStyle = THEME;
            ctx.fillStyle = 'rgba(212, 175, 55, 0.15)';
            ctx.lineWidth = 4;

            // Draw the Main Cardioid
            // Parametric equations for the Mandelbrot cardioid:
            // x = (2cos(t) - cos(2t)) * scale / 4
            // y = (2sin(t) - sin(2t)) * scale / 4
            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                const x = cx + (2 * Math.cos(t) - Math.cos(2 * t)) * (scale / 2);
                const y = cy + (2 * Math.sin(t) - Math.sin(2 * t)) * (scale / 2);
                
                if (t === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Draw the Period-2 Bulb (Circle attached to the left of the cardioid)
            // It centers exactly at -1 on the complex plane, with a radius of 0.25
            const p2Center_x = cx - scale * 1.5;
            const p2Radius = scale / 2;
            
            ctx.beginPath();
            ctx.arc(p2Center_x, cy, p2Radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Draw Period-3 Bulbs (Top and Bottom)
            const p3CenterTop_x = cx - scale * 0.15;
            const p3CenterTop_y = cy - scale * 1.35;
            const p3Radius = scale * 0.16;

            ctx.beginPath();
            ctx.arc(p3CenterTop_x, p3CenterTop_y, p3Radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(p3CenterTop_x, cy + scale * 1.35, p3Radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Add the distinctive inner connecting tracks / central lines of the crop circle
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(p2Center_x - p2Radius, cy);
            ctx.lineTo(cx + scale * 0.5, cy);
            ctx.stroke();
            
            // Small circles connecting the bulbs
            ctx.beginPath(); ctx.arc(cx - scale*0.5, cy, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(p2Center_x, cy, 6, 0, Math.PI*2); ctx.fill();
        }
        
        draw();
    </script>
</body>
</html>
